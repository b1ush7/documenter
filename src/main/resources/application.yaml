spring:
  application:
    name: documenter
  profiles:
    active:
      - dev
  # 数据库迁移（TODO 3.4）：启动时自动执行 src/main/resources/db/migration 下未执行的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 生产环境禁止清理，避免误删数据
    clean-disabled: true
    validate-on-migrate: true
  # 上传限制（TODO 3.3）。此处的上限必须与 res.storage.upload.max-size-bytes 保持一致，
  # 否则会出现「容器先拒绝」或「通过了容器却被业务层拒绝」两种不一致的报错。
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_UPLOAD_BYTES:52428800}
      max-request-size: ${STORAGE_MAX_REQUEST_BYTES:57671680}
      # 超过 256KB 落到临时文件，避免大文件占用堆内存
      file-size-threshold: 256KB

server:
  port: ${SERVER_PORT:8080}

res:
  jwt:
    issuer: documenter
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    authorization-name: Authorization
    # 默认值仅供本地开发；部署必须通过环境变量 JWT_SECRET_KEY 覆盖（TODO 3.4 密钥外置）
    secret-key: ${JWT_SECRET_KEY:documenter}
    key: id
  # 验证码策略（TODO 3.1）
  verification:
    code-length: ${VERIFICATION_CODE_LENGTH:6}
    ttl: ${VERIFICATION_TTL:5m}
    resend-interval: ${VERIFICATION_RESEND_INTERVAL:60s}
    daily-limit: ${VERIFICATION_DAILY_LIMIT:10}
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}
    # true 时验证码写入服务端日志而不真正发送；上线前必须改为 false 并接入真实渠道
    mock-enabled: ${VERIFICATION_MOCK_ENABLED:true}
  # 文件存储（TODO 3.3）。各环境只需覆盖 local.root / local.temp 两个路径。
  storage:
    type: local
    local:
      root: ${STORAGE_LOCAL_ROOT:./data/storage}
      temp: ${STORAGE_LOCAL_TEMP:./data/tmp}
      temp-cleanup-enabled: ${STORAGE_TEMP_CLEANUP_ENABLED:true}
      temp-retention: ${STORAGE_TEMP_RETENTION:24h}
      temp-cleanup-interval: ${STORAGE_TEMP_CLEANUP_INTERVAL:1h}
    upload:
      max-size-bytes: ${STORAGE_MAX_UPLOAD_BYTES:52428800}
      # 同一用户每日上传次数上限（Redis 原子计数）
      hourly-limit: ${UPLOAD_DAILY_LIMIT:60}
      max-pdf-pages: ${STORAGE_MAX_PDF_PAGES:200}
      max-image-pixels: ${STORAGE_MAX_IMAGE_PIXELS:40000000}
      max-archive-entries: ${STORAGE_MAX_ARCHIVE_ENTRIES:10000}
      max-archive-expanded-size-bytes: ${STORAGE_MAX_ARCHIVE_EXPANDED_BYTES:209715200}
      max-archive-compression-ratio: ${STORAGE_MAX_ARCHIVE_COMPRESSION_RATIO:200}
    pdf:
      max-extracted-chars-per-page: ${PDF_MAX_EXTRACTED_CHARS_PER_PAGE:100000}
      max-extracted-chars-total: ${PDF_MAX_EXTRACTED_CHARS_TOTAL:2000000}
      preview-dpi: ${PDF_PREVIEW_DPI:144}
      max-preview-dpi: ${PDF_MAX_PREVIEW_DPI:200}
      max-conversion-images: ${PDF_MAX_CONVERSION_IMAGES:100}
      max-conversion-image-pixels-total: ${PDF_MAX_CONVERSION_IMAGE_PIXELS_TOTAL:100000000}
    xlsx:
      max-read-cells: ${XLSX_MAX_READ_CELLS:100000}
      max-edit-operations: ${XLSX_MAX_EDIT_OPERATIONS:500}
      max-structural-units: ${XLSX_MAX_STRUCTURAL_UNITS:1000}
      max-sortable-cells: ${XLSX_MAX_SORTABLE_CELLS:10000}
  # 云端 OCR。模型地址、模型名和加密 API Key 复用管理端 scope=OCR 的默认启用的模型配置。
  # 启用后扫描页/图片会发送到该云端服务，不适合不能出境或不能上云的文档。
  ocr:
    enabled: ${OCR_ENABLED:false}
    default-language: ${OCR_DEFAULT_LANGUAGE:auto}
    allowed-languages: ${OCR_ALLOWED_LANGUAGES:auto,zh,en}
    dpi: ${OCR_PDF_DPI:200}
    max-dpi: ${OCR_MAX_PDF_DPI:300}
    max-pages: ${OCR_MAX_PAGES:50}
    max-words: ${OCR_MAX_WORDS:200000}
    max-output-chars: ${OCR_MAX_OUTPUT_CHARS:2000000}
    max-image-bytes: ${OCR_MAX_IMAGE_BYTES:20971520}
    max-response-bytes: ${OCR_MAX_RESPONSE_BYTES:16777216}
    low-confidence-threshold: ${OCR_LOW_CONFIDENCE_THRESHOLD:60}
    cache-enabled: ${OCR_CACHE_ENABLED:true}
    cache-directory: ${OCR_CACHE_DIRECTORY:ocr-cache}
  # 模型配置的密钥加密（TODO 3.2：模型密钥不得返回前端）
  model-config:
    # 用于加密数据库中的模型 API Key（AES-256-GCM）。
    # 必须通过环境变量 MODEL_CONFIG_SECRET 配置一个至少 32 字节的随机串；
    # 留空时应用仍可启动，但保存模型密钥会明确报错，避免「以为加密了其实没加密」。
    secret: ${MODEL_CONFIG_SECRET:}
  # 处理任务（TODO 3.4）
  task:
    # 调度与处理使用独立有界线程池；以下容量分别作用于两个池。
    # 队列满或执行器关闭时任务标记为 FAILED / QUEUE_FULL，通过已有重试入口重试。
    core-pool-size: ${TASK_CORE_POOL_SIZE:2}
    max-pool-size: ${TASK_MAX_POOL_SIZE:4}
    queue-capacity: ${TASK_QUEUE_CAPACITY:50}
    keep-alive: ${TASK_KEEP_ALIVE:60s}
    default-timeout: ${TASK_DEFAULT_TIMEOUT:10m}
    default-max-retry: ${TASK_DEFAULT_MAX_RETRY:2}
    shutdown-await: ${TASK_SHUTDOWN_AWAIT:30s}
    # 启动时把中断的 RUNNING 任务标记为失败，避免前端永远看到「运行中」
    recover-on-startup: ${TASK_RECOVER_ON_STARTUP:true}
    # CONVERT/EXPORT 已有真实处理器，未开始的 PENDING 任务可在单实例重启后重新入队
    requeue-pending-on-startup: ${TASK_REQUEUE_PENDING_ON_STARTUP:true}
    # 仅保留历史任务兼容；CONVERT/EXPORT 已由真实处理器接管
    placeholder-enabled: ${TASK_PLACEHOLDER_ENABLED:false}
  # 页面版式预览（TODO 3.3）与兼容性验收（TODO 4.1）
  preview:
    # 预览渲染的默认 DPI 与上限
    default-dpi: ${PREVIEW_DEFAULT_DPI:110}
    max-dpi: ${PREVIEW_MAX_DPI:200}
    max-page-pixels: ${PREVIEW_MAX_PAGE_PIXELS:40000000}
    # 缓存放存储临时目录下，由既有的过期临时文件清理任务自动回收
    cache-enabled: ${PREVIEW_CACHE_ENABLED:true}
    cache-directory: ${PREVIEW_CACHE_DIRECTORY:preview-cache}
    # Office 渲染后端：none / kit
    # kit 指打包好的 LibreOffice kit（Node CLI），同时提供页面渲染与格式转换。
    # PDF 与图片预览不需要它；DOCX/XLSX 版式预览与兼容性验收需要。
    office-backend: ${PREVIEW_OFFICE_BACKEND:none}
    office-kit-node: ${PREVIEW_OFFICE_KIT_NODE:}
    office-kit-cli: ${PREVIEW_OFFICE_KIT_CLI:}
    office-timeout: ${PREVIEW_OFFICE_TIMEOUT:120s}
    office-max-input-bytes: ${PREVIEW_OFFICE_MAX_INPUT_BYTES:52428800}
    # 中文字体（TODO 4.3）
    # 实测结论（Windows + 内置 native 后端）：font-directory 会传给渲染工具并影响
    # missingFonts 诊断（传入不含中文的目录后缺失列表会新增 SimSun），
    # 但不改变实际渲染结果 —— 该后端渲染时直接取操作系统字体库，
    # 传入只含拉丁字体的目录后产物与用系统字体时逐字节相同。
    # 因此：Windows 上中文能正确渲染的前提是宿主机装了中文字体；
    # Linux 的字体解析由 fontconfig 决定，该目录可能真正生效，但尚未在 Linux 验证。
    # 这些参数的作用是让缺字问题在兼容性报告里可见（WARNING），而不是修好它。
    font-directory: ${PREVIEW_FONT_DIRECTORY:}
    # 缺字时的后备字体族（逗号分隔）
    font-fallbacks: ${PREVIEW_FONT_FALLBACKS:}
    # 未显式指定字体的内容使用的初始字体族
    initial-font-family: ${PREVIEW_INITIAL_FONT_FAMILY:}
    # 兼容性验收：最多检查页数与渲染 DPI
    compatibility-max-pages: ${PREVIEW_COMPAT_MAX_PAGES:20}
    compatibility-dpi: ${PREVIEW_COMPAT_DPI:110}
    # 页面边缘裁切检测范围（像素），0 表示关闭
    clipping-margin-pixels: ${PREVIEW_CLIPPING_MARGIN:2}
  # 文本模型接入（TODO 4.2）
  # 部署时在 base-url / api-key / model-name 填入实际值即可启用。
  # 密钥建议用环境变量注入，不要写进版本库。
  ai:
    # 总开关。false 时对话接口返回明确提示，其余功能不受影响
    enabled: ${AI_ENABLED:false}
    # 提供方：auto / openai / stub
    # auto：配齐 base-url + api-key + model-name 就用真实模型，否则回退桩模型
    # stub：强制使用桩模型（无网络的测试与演示环境，产出非真实模型结果）
    provider: ${AI_PROVIDER:auto}
    # 必须指向兼容 OpenAI 协议的端点
    # 例：https://dashscope.aliyuncs.com/compatible-mode/v1
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:}
    temperature: ${AI_TEMPERATURE:0.2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    timeout: ${AI_TIMEOUT:60s}
    max-retries: ${AI_MAX_RETRIES:2}
    # ---- 智能体循环上限 ----
    # 必须有上限：模型可能陷入「调用工具 → 结果不理想 → 再调用」的循环
    max-steps: ${AI_MAX_STEPS:8}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:12}
    max-same-tool-repeats: ${AI_MAX_SAME_TOOL_REPEATS:4}
    max-model-retries: ${AI_MAX_MODEL_RETRIES:1}
    # ---- 提示词与上下文 ----
    # 长文档按结构分块截断，而不是简单截字符串（后者会把段落切成两半）
    max-document-chars: ${AI_MAX_DOCUMENT_CHARS:12000}
    max-tool-result-chars: ${AI_MAX_TOOL_RESULT_CHARS:6000}
    record-tool-messages: ${AI_RECORD_TOOL_MESSAGES:true}
    # 提交前确认：编辑类工具只产出计划，不直接落版本
    require-confirmation: ${AI_REQUIRE_CONFIRMATION:true}
    # ---- 成本统计 ----
    # 默认 0 表示不计价。真实价格随模型与供应商变动，因此要求显式配置，
    # 而不是内置一张容易过期的价目表（过期价目比没有更糟）
    cost-per-1k-input-tokens: ${AI_COST_PER_1K_INPUT:0}
    cost-per-1k-output-tokens: ${AI_COST_PER_1K_OUTPUT:0}
    daily-call-limit-per-user: ${AI_DAILY_CALL_LIMIT:0}
    quota-zone: ${AI_QUOTA_ZONE:Asia/Shanghai}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.documenter: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    # 每个请求都带 requestId，便于按一次调用把日志串起来（TODO 3.4）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
