spring:
  application:
    name: documenter
  profiles:
    active:
      - dev
  # 数据库迁移（TODO 3.4）：启动时自动执行 src/main/resources/db/migration 下未执行的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 生产环境禁止清理，避免误删数据
    clean-disabled: true
    validate-on-migrate: true
  # 上传限制（TODO 3.3）。此处的上限必须与 res.storage.upload.max-size-bytes 保持一致，
  # 否则会出现「容器先拒绝」或「通过了容器却被业务层拒绝」两种不一致的报错。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
      # 超过 256KB 落到临时文件，避免大文件占用堆内存
      file-size-threshold: 256KB

server:
  port: 8080

res:
  jwt:
    issuer: documenter
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    authorization-name: Authorization
    # 默认值仅供本地开发；部署必须通过环境变量 JWT_SECRET_KEY 覆盖（TODO 3.4 密钥外置）
    secret-key: ${JWT_SECRET_KEY:documenter}
    key: id
  # 验证码策略（TODO 3.1）
  verification:
    code-length: 6
    ttl: 5m
    resend-interval: 60s
    daily-limit: 10
    max-attempts: 5
    # true 时验证码写入服务端日志而不真正发送；上线前必须改为 false 并接入真实渠道
    mock-enabled: true
  # 文件存储（TODO 3.3）。各环境只需覆盖 local.root / local.temp 两个路径。
  storage:
    type: local
    local:
      root: ${STORAGE_LOCAL_ROOT:./data/storage}
      temp: ${STORAGE_LOCAL_TEMP:./data/tmp}
    upload:
      max-size-bytes: 52428800
      # 同一用户每日上传次数上限（Redis 原子计数）
      hourly-limit: 60
  # 处理任务（TODO 3.4）
  task:
    # 有界队列 + CallerRuns 拒绝策略：队列满时由提交线程执行，形成背压而不是丢任务
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
    keep-alive: 60s
    default-timeout: 10m
    default-max-retry: 2
    shutdown-await: 30s
    # 启动时把中断的 RUNNING 任务标记为失败，避免前端永远看到「运行中」
    recover-on-startup: true
    # P0 阶段处理器是占位实现，重新入队没有意义；接入真实处理器后改为 true
    requeue-pending-on-startup: false
    # 占位处理器开关：接入真实处理器时必须改为 false，否则会争抢任务类型导致启动失败
    placeholder-enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.documenter: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    # 每个请求都带 requestId，便于按一次调用把日志串起来（TODO 3.4）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
